name: Compile dependabot updates

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  fetch-dependabot-metadata:
    runs-on: ubuntu-latest

    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    # Map the step output to a job output for subsequent jobs
    outputs:
      package-ecosystem: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Fetch dependabot metadata
        id: dependabot-metadata
        uses: ./

  build-dependabot-changes:
    runs-on: ubuntu-latest
    needs: [fetch-dependabot-metadata]
    permissions:
      contents: read

    # Any npm dependency can affect the bundle, including indirect dependencies and build tooling.
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && needs.fetch-dependabot-metadata.outputs.package-ecosystem == 'npm_and_yarn' }}
    outputs:
      package-ecosystem: ${{ needs.fetch-dependabot-metadata.outputs.package-ecosystem }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - name: Rebuild the dist/ directory
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-dependabot-changes:
    runs-on: ubuntu-latest
    needs: [fetch-dependabot-metadata, build-dependabot-changes]
    permissions:
      contents: read

    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && needs.build-dependabot-changes.outputs.package-ecosystem == 'npm_and_yarn' }}
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.FETCH_METADATA_ACTION_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.FETCH_METADATA_ACTION_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.generate_token.outputs.token }}

      - uses: actions/download-artifact@v4
        with:
          name: rebuilt-dist
          path: dist/

      - name: Commit and push dist changes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add dist/

          if git diff --cached --quiet -- dist/; then
            echo "The dependency update does not affect dist/"
            exit 0
          fi

          # Specifying the full email allows the avatar to show up: https://github.com/orgs/community/discussions/26560
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[dependabot skip] Update dist/ with build changes"
          git push origin "HEAD:${HEAD_REF}"
